name: Daily market news to Discord

on:
  schedule:
    # Avoid timezone-dependent cron registration. Wake every five minutes in
    # both possible UTC hours for 15:00 Israel time; the gate below accepts
    # only 15:00-15:59 Asia/Jerusalem and one successful attempt per day.
    - cron: '*/5 12,13 * * *'
  workflow_dispatch:
    inputs:
      send_to_discord:
        description: 'Send to Discord (leave off to generate downloadable previews only)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-market-news
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/scanner
    steps:
      - name: Decide whether today's scheduled brief is still needed
        id: schedule_gate
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "run_digest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          israel_hour=$(TZ=Asia/Jerusalem date +%H)
          if [ "$israel_hour" -ne 15 ]; then
            echo "Ignoring UTC wake-up outside 15:00-15:59 Israel time."
            echo "run_digest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          window_start=$(python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Jerusalem"))
          start = now.replace(hour=15, minute=0, second=0, microsecond=0).astimezone(timezone.utc)
          print(start.isoformat().replace("+00:00", "Z"))
          PY
          )
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-market-news.yml/runs?event=schedule&status=completed&per_page=100"
          prior_successes=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url" | jq --arg start "$window_start" --argjson current "$GITHUB_RUN_ID" \
            '[.workflow_runs[] | select(.id != $current and .conclusion == "success" and .created_at >= $start)] | length')

          if [ "$prior_successes" -gt 0 ]; then
            echo "Today's scheduled brief already succeeded; skipping retry."
            echo "run_digest=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful scheduled brief exists for today."
            echo "run_digest=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.schedule_gate.outputs.run_digest == 'true'
      - uses: actions/setup-python@v7
        if: steps.schedule_gate.outputs.run_digest == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/scanner/requirements-daily-news.txt
      - name: Install report dependencies
        if: steps.schedule_gate.outputs.run_digest == 'true'
        run: |
          python -m pip install -r requirements-daily-news.txt
          python -m playwright install --with-deps chromium
      - name: Generate report and optionally send
        if: steps.schedule_gate.outputs.run_digest == 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_NEWS_CHANNEL_ID: ${{ secrets.DISCORD_NEWS_CHANNEL_ID }}
          DISCORD_NEWS_CHANNEL_NAME: ${{ vars.DISCORD_NEWS_CHANNEL_NAME || 'stock-news' }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWS_STATE_BACKEND: supabase
          SEND_TO_DISCORD: ${{ github.event_name == 'schedule' || inputs.send_to_discord }}
        run: |
          args=()
          if [ "$SEND_TO_DISCORD" = "true" ]; then args+=(--send); fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then args+=(--scheduled); fi
          python run_daily_news.py "${args[@]}"
      - name: Save report files
        if: ${{ always() && steps.schedule_gate.outputs.run_digest == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: daily-market-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: services/scanner/daily-news-output/
          if-no-files-found: ignore
          retention-days: 14
