# Full-universe runs still pull full history from Supabase per ticker each time.
# Stooq/yfinance are only called when start<=today; after today’s bar exists, HTTP
# load drops, but DB work stays high. If a run exceeds 15 minutes, the next run
# queues (concurrency) instead of overlapping—reduces 429 risk vs parallel runs.
name: Refresh all stocks and patterns

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-market-snapshot.yml"
      - "services/scanner/**"
  schedule:
    # --- US: NYSE/NASDAQ regular session Mon-Fri ---
    # GitHub Actions schedule is UTC.
    # GitHub can delay or drop scheduled events. Retry at staggered quarter-hour
    # offsets; the recent-full-scan guard limits expensive work to about hourly.
    # The early attempt gives a delayed event a chance to arrive near US open.
    - cron: "37 12 * * 1-5"
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional space-separated tickers (leave empty for full universe)"
        required: false
        default: ""
      universe:
        description: "When tickers empty — all (S&P 500 + TA-125), us, or ta"
        type: choice
        options:
          - all
          - us
          - ta
        default: all
concurrency:
  group: refresh-market-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: services/scanner

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node for pattern detectors
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scanner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run refresh job
        id: refresh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GHA_REFRESH_TICKERS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tickers || '' }}
          GHA_REFRESH_UNIVERSE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.universe || 'all' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${GHA_REFRESH_TICKERS:-}" ]; then
            # Word-split on whitespace: "AAPL MSFT" -> multiple argv after --tickers
            python run_refresh.py --tickers ${GHA_REFRESH_TICKERS}
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python run_refresh.py --universe "${GHA_REFRESH_UNIVERSE:-all}"
          else
            # Scheduled and scanner-code push runs refresh the full universe.
            python run_refresh.py --universe all --skip-if-recent-full-minutes 50
          fi

      - name: Check alert triggers
        if: steps.refresh.outputs.did_scan == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run_alert_check.py

      - name: Store market news headline
        if: steps.refresh.outputs.did_scan == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run_market_news_check.py
