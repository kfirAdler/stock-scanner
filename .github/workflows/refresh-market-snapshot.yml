name: Refresh all stocks and patterns

on:
  schedule:
    # Refresh hourly near the top of the hour during the regular US session.
    # 10:02 is the first top-of-hour slot after the 09:30 open; 16:02 captures
    # the closing bar. The timezone keeps the schedule aligned across US DST.
    - cron: "2 10-16 * * 1-5"
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      force_recompute:
        description: "Rebuild snapshots even if prices are unchanged"
        type: boolean
        default: false
      tickers:
        description: "Optional space-separated tickers (leave empty for full universe)"
        required: false
        default: ""
      universe:
        description: "When tickers empty — all (S&P 500 + TA-125), us, or ta"
        type: choice
        options:
          - all
          - us
          - ta
        default: all

concurrency:
  group: refresh-market-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/scanner

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node for pattern detectors
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scanner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run refresh job
        timeout-minutes: 45
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_RECOMPUTE: ${{ inputs.force_recompute || false }}
          GHA_REFRESH_TICKERS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tickers || '' }}
          GHA_REFRESH_UNIVERSE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.universe || 'all' }}
        run: |
          set -euo pipefail
          args=()
          if [ "$FORCE_RECOMPUTE" = "true" ]; then args+=(--force-recompute); fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${GHA_REFRESH_TICKERS:-}" ]; then
            # Word-split on whitespace: "AAPL MSFT" -> multiple argv after --tickers
            python run_refresh.py "${args[@]}" --tickers ${GHA_REFRESH_TICKERS}
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python run_refresh.py "${args[@]}" --universe "${GHA_REFRESH_UNIVERSE:-all}"
          else
            # Scheduled runs always refresh the complete S&P 500 + TA-125 universe.
            python run_refresh.py "${args[@]}" --universe all
          fi

      - name: Check alert triggers
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run_alert_check.py
      
      - name: Store market news headline
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run_market_news_check.py
      
      - name: Refresh company metadata (daily)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        timeout-minutes: 10
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run_refresh_metadata.py --universe all
